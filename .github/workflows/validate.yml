name: Validate discovery ontology
on:
  push:
    paths: ['eco', '*.ttl', 'versions/**', 'tests/**', 'examples/**', '.github/workflows/validate.yml']
  pull_request:
    paths: ['eco', '*.ttl', 'versions/**', 'tests/**', 'examples/**', '.github/workflows/validate.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      - run: python tests/validate.py
      - run: python tests/agent_cards.py
